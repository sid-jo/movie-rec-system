global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Route firing alerts to Alertmanager (same docker-compose network).
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alerts.yml"

scrape_configs:
  # Flask/gunicorn recommendation API (must match REC_SERVICE_PORT, default 8082).
  # Prometheus runs inside Docker; host services are reached via host.docker.internal
  # (see docker-compose extra_hosts). On Linux VM this resolves to the host gateway.
  - job_name: "recommendation-service"
    static_configs:
      - targets: ["host.docker.internal:8082"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # Kafka-backed online metrics (WTR, PRR, cost, drift, availability proxy).
  # Must match METRICS_EXPORTER_PORT, default 8083.
  - job_name: "metrics-exporter"
    static_configs:
      - targets: ["host.docker.internal:8083"]
    scrape_interval: 15s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
