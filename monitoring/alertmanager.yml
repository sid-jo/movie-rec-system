# Alertmanager: extend with slack_configs, email_configs, or webhook_configs for your team.
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
