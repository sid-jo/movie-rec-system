groups:
  - name: recommendation_service
    rules:
      - alert: ServiceDown
        expr: up{job="recommendation-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Recommendation service is down"
          description: "The recommendation service has been unreachable for more than 2 minutes."

      - alert: MetricsExporterDown
        expr: up{job="metrics-exporter"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Kafka metrics exporter is down"
          description: "Online quality, cost, and drift metrics are not being scraped (check tunnel and process on :8083)."

      - alert: HighErrorRate
        expr: rate(recommendation_errors_total[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High recommendation error rate"
          description: "Error rate exceeds 0.1/sec for 3 minutes."

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(recommendation_latency_seconds_bucket[5m])) > 0.6
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High recommendation latency (p95 > 600ms)"

      - alert: NoRecommendationTraffic
        expr: online_rec_rate_per_minute == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No recommendation events observed in Kafka for 5 minutes"
          description: "The service may be down or unreachable by users."

      - alert: RatingDriftDetected
        expr: drift_rating_shift_detected == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Rating distribution drift detected"
          description: "Mean rating has shifted > 0.5 from reference for 10 minutes."

      - alert: WatchDurationDriftDetected
        expr: drift_watch_duration_shift_detected == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Watch duration drift detected"
          description: "Mean watch duration has shifted > 30% from reference for 10 minutes."
